<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>
   모아 — 칸반보드
  </title>
<link href="styles.css" rel="stylesheet"/>
</head>
<body>
<aside>
<div class="logo">
<span>
     ▦
    </span>
    모아
   </div>
<div class="workspace">
    MY WORKSPACE
   </div>
<div class="nav">
    ▤   나의 보드
   </div>
<div class="aside-bottom">카드는 Supabase에 저장됩니다.</div>
</aside>
<main>
<header class="top">
<div class="crumb">
     내 워크스페이스   /
     <strong>
      나의 보드
     </strong>
</div>
<div aria-label="개인 워크스페이스" class="avatar">
     나
    </div>
</header>
<div class="heading">
<div>
<h1>
      오늘도, 하나씩.
     </h1>
<p class="intro">
      해야 할 일부터 끝낸 일까지, 한눈에 정리하세요.
     </p>
</div>
<button class="primary" id="new">
     ＋ 새 할 일
    </button>
</div>
<section aria-label="보드 및 계정" class="account-panel"><div class="account-row"><label for="scope">보드 선택</label><select id="scope"><option value="public">공용 보드</option><option value="private">나의 개인 보드</option></select><button class="secondary" id="reload">새로고침</button><span aria-live="polite" id="account-status">로그인하지 않음</span><button class="secondary" hidden="" id="logout">로그아웃</button></div><form class="account-row" id="auth-form"><input aria-label="이메일" autocomplete="username" id="email" placeholder="이메일" required="" type="email"/><input aria-label="비밀번호" autocomplete="current-password" id="password" minlength="8" placeholder="비밀번호 (8자 이상)" required="" type="password"/><button class="secondary" type="submit">로그인</button><button class="secondary" id="signup" type="button">회원가입</button></form><p id="auth-message" role="status"></p></section><div class="toolbar">
<div class="filters">
<input aria-label="할 일 검색" id="search" placeholder="⌕  할 일 검색"/>
<select aria-label="우선순위 필터" id="filter">
<option value="">
       모든 우선순위
      </option>
      높음
      <option value="normal">
       보통
      </option>
<option value="low">
       낮음
      </option>
</select>
</div>
<span aria-live="polite" id="summary">
</span>
</div>
<div class="board" id="board">
</div>
<p class="note">공용 보드는 누구나 변경할 수 있습니다. 개인 보드는 로그인한 본인만 접근합니다. 다른 기기의 변경은 새로고침 버튼으로 불러오세요.</p>
<p id="error" role="alert">
</p>
</main>
<dialog id="modal">
<form id="form">
<h2 id="modal-title">
     새 할 일
    </h2><p id="modal-error" role="alert"></p>
<label for="title">
     할 일 제목 *
    </label>
<input id="title" maxlength="120" placeholder="무엇을 해야 하나요?" required=""/>
<label for="desc">
     설명
    </label>
<textarea id="desc" maxlength="2000" placeholder="필요한 내용을 남겨주세요"></textarea>
<div class="row">
<div>
<label for="status">
       상태
      </label>
<select id="status">
<option value="todo">
        할 일
       </option>
<option value="doing">
        진행 중
       </option>
<option value="done">
        완료
       </option>
</select>
</div>
<div>
<label for="priority">
       우선순위
      </label>
<select id="priority">
<option value="normal">
        보통
       </option>
<option value="high">
        높음
       </option>
<option value="low">
        낮음
       </option>
</select>
</div>
</div>
<label for="due">
     마감일
    </label>
<input id="due" type="date"/>
<div class="actions">
<button class="secondary danger" id="delete" type="button">
      삭제
     </button>
<button class="secondary" id="cancel" type="button">
      취소
     </button>
<button class="primary" type="submit">
      저장
     </button>
</div>
</form>
</dialog>
<script src="config.js"></script><script src="app.js">
</script>
</body>
</html>
