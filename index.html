<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모아 — 칸반보드</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#242b38;font-family:system-ui,'Apple SD Gothic Neo','Nanum Gothic',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8c83ed;outline-offset:3px}aside{position:fixed;width:215px;inset:0 auto 0 0;background:white;border-right:1px solid #e6e8ed;padding:32px 20px}.logo{font-size:27px;font-weight:850;letter-spacing:-2px}.logo span{color:#6755cd}small,.muted{color:#687182}.nav{margin-top:48px;background:#eeebfa;color:#5743b2;border-radius:10px;padding:13px;font-weight:700}.workspace{font-size:11px;letter-spacing:2px;margin:35px 12px 12px;color:#737b8c}.aside-bottom{position:absolute;bottom:28px;font-size:12px;line-height:1.8;color:#687182}main{margin-left:215px;padding:36px 44px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e4e6ec;padding-bottom:26px}.crumb{font-size:13px;color:#687182}.avatar{background:#eeeafa;color:#5945b1;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-weight:700}h1{font-size:32px;letter-spacing:-1.3px;margin:31px 0 8px}.intro{margin:0;color:#687182;font-size:14px}.heading,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.primary{border:0;background:#6552c8;color:white;padding:12px 18px;border-radius:9px;font-weight:700}.toolbar{margin:30px 0 24px}.filters{display:flex;gap:10px;flex-wrap:wrap}input,select,textarea{border:1px solid #dde1e8;border-radius:8px;padding:10px 12px;background:white;color:#242b38}#search{width:250px}#summary{font-size:13px;color:#687182}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.column{background:#eef0f4;border-radius:13px;min-height:480px;padding:17px 13px}.column.over{outline:2px dashed #6552c8;background:#e9e5fa}.col-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:750;margin:1px 5px 20px}.dot{width:8px;height:8px;border-radius:50%;background:#9199a8}.doing .dot{background:#9c7cdc}.done .dot{background:#4f9980}.count{background:#e1e4ea;padding:2px 7px;border-radius:5px;color:#606879;font-size:11px}.col-title button{margin-left:auto;border:0;background:none;font-size:22px;color:#737b8c}.cards{min-height:80px}.card{background:white;border:1px solid #e4e6ed;border-radius:10px;padding:17px;margin-bottom:12px;box-shadow:0 2px 3px #20263d04;cursor:grab}.card:active{cursor:grabbing}.card h3{font-size:14px;margin:12px 0 8px;line-height:1.5;overflow-wrap:anywhere}.card p{font-size:12px;line-height:1.7;color:#687182;margin:0 0 17px;white-space:pre-wrap;overflow-wrap:anywhere}.badge{font-size:10px;font-weight:700;border-radius:5px;padding:4px 7px;background:#f0edf9;color:#6552ac}.badge.high{background:#fff0ee;color:#b13e35}.badge.low{background:#eaf4ef;color:#397458}.card-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #f0f1f4;padding-top:11px;font-size:11px;color:#737b8c}.edit{border:0;background:#f4f4f8;color:#5e577a;padding:4px 8px;border-radius:5px}.empty{text-align:center;font-size:12px;color:#70798a;padding:35px 5px}.add{width:100%;text-align:left;border:0;background:none;color:#687182;padding:10px;font-size:12px}.note{font-size:12px;color:#737b8c;margin-top:24px}dialog{width:min(480px,92vw);border:1px solid #e3e5ed;border-radius:17px;padding:26px;box-shadow:0 20px 80px #25203533}dialog::backdrop{background:#23213766}dialog h2{font-size:21px;margin-top:0}label{display:block;font-size:12px;font-weight:650;margin:17px 0 7px}form input,form select,form textarea{width:100%}textarea{min-height:90px;resize:vertical}.row{display:flex;gap:14px}.row>div{flex:1}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:25px}.secondary{border:1px solid #dde1e8;background:white;border-radius:8px;padding:10px 15px}.danger{color:#b13e35;margin-right:auto}#error{color:#b13e35;font-size:12px} @media(max-width:1050px){aside{width:170px}main{margin-left:170px;padding:28px 22px}.board{gap:12px}}@media(max-width:760px){aside{position:static;width:auto;padding:18px 22px;border-bottom:1px solid #e6e8ed}.logo{font-size:23px}.nav,.workspace,.aside-bottom{display:none}main{margin:0;padding:20px}.top{padding-bottom:16px}h1{font-size:27px}.heading{align-items:flex-start}.heading .primary{margin-top:30px;white-space:nowrap}.toolbar{align-items:flex-start;flex-direction:column}.board{grid-template-columns:1fr}.column{min-height:200px}#search{width:100%}.filters{width:100%}.intro{font-size:12px}}
</style></head><body><aside><div class="logo"><span>▦</span> 모아</div><div class="workspace">MY WORKSPACE</div><div class="nav">▤ &nbsp; 나의 보드</div><div class="aside-bottom">작은 할 일을 모아,<br>더 가벼운 하루로.<br><br>● 이 브라우저에 자동 저장</div></aside><main><header class="top"><div class="crumb">내 워크스페이스 &nbsp; / &nbsp; <strong>나의 보드</strong></div><div class="avatar" aria-label="개인 워크스페이스">나</div></header><div class="heading"><div><h1>오늘도, 하나씩.</h1><p class="intro">해야 할 일부터 끝낸 일까지, 한눈에 정리하세요.</p></div><button class="primary" id="new">＋ 새 할 일</button></div><div class="toolbar"><div class="filters"><input id="search" aria-label="할 일 검색" placeholder="⌕  할 일 검색"><select id="filter" aria-label="우선순위 필터"><option value="">모든 우선순위</option value="high">높음</option><option value="normal">보통</option><option value="low">낮음</option></select></div><span id="summary" aria-live="polite"></span></div><div class="board" id="board"></div><p class="note">카드를 드래그하거나 ‘수정’에서 상태를 변경하세요. 저장된 데이터는 이 기기·브라우저에서만 유지됩니다.</p><p id="error" role="alert"></p></main><dialog id="modal"><form id="form"><h2 id="modal-title">새 할 일</h2><label for="title">할 일 제목 *</label><input id="title" required maxlength="120" placeholder="무엇을 해야 하나요?"><label for="desc">설명</label><textarea id="desc" maxlength="2000" placeholder="필요한 내용을 남겨주세요"></textarea><div class="row"><div><label for="status">상태</label><select id="status"><option value="todo">할 일</option><option value="doing">진행 중</option><option value="done">완료</option></select></div><div><label for="priority">우선순위</label><select id="priority"><option value="normal">보통</option><option value="high">높음</option><option value="low">낮음</option></select></div></div><label for="due">마감일</label><input type="date" id="due"><div class="actions"><button type="button" id="delete" class="secondary danger">삭제</button><button type="button" id="cancel" class="secondary">취소</button><button type="submit" class="primary">저장</button></div></form></dialog><script>
'use strict';
const $=id=>document.getElementById(id), key='moa-kanban-v1', states={todo:'할 일',doing:'진행 중',done:'완료'}, priorities={high:'높음',normal:'보통',low:'낮음'};let tasks=[],editing=null,dragging=null;
try{const raw=localStorage.getItem(key);if(raw){const parsed=JSON.parse(raw);if(!Array.isArray(parsed))throw Error();tasks=parsed.filter(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&Object.hasOwn(states,t.status)&&Object.hasOwn(priorities,t.priority)).map(t=>({...t,desc:typeof t.desc==='string'?t.desc:'',due:typeof t.due==='string'?t.due:''}));}}catch(e){$('error').textContent='저장된 데이터를 읽지 못했습니다. 브라우저 저장 설정을 확인하세요.';}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(key,JSON.stringify(tasks));$('error').textContent='';}catch(e){$('error').textContent='저장 공간 또는 브라우저 설정으로 저장하지 못했습니다. 현재 변경은 창을 닫으면 사라질 수 있습니다.';}render();}
function render(){const q=$('search').value.toLocaleLowerCase(),p=$('filter').value;const visible=tasks.filter(t=>(t.title+' '+t.desc).toLocaleLowerCase().includes(q)&&(!p||t.priority===p));$('summary').textContent=`전체 ${tasks.length}개 · 완료 ${tasks.filter(t=>t.status==='done').length}개`;$('board').innerHTML=Object.entries(states).map(([s,label])=>{const list=visible.filter(t=>t.status===s);return `<section class="column ${s}" data-status="${s}" aria-label="${label}"><div class="col-title"><span class="dot"></span>${label}<span class="count">${list.length}</span><button data-add="${s}" aria-label="${label}에 할 일 추가">＋</button></div><div class="cards">${list.length?list.map(t=>`<article class="card" draggable="true" data-id="${esc(t.id)}"><span class="badge ${t.priority}">${priorities[t.priority]}</span><h3>${esc(t.title)}</h3>${t.desc?`<p>${esc(t.desc)}</p>`:''}<div class="card-foot"><span>${t.due?'마감 '+esc(t.due):'마감일 없음'}</span><button class="edit" data-edit="${esc(t.id)}" aria-label="${esc(t.title)} 수정">수정 ↗</button></div></article>`).join(''):'<div class="empty">아직 등록된 할 일이 없어요.</div>'}</div><button class="add" data-add="${s}">＋ 할 일 추가</button></section>`}).join('');}
function openEditor(id=null,status='todo'){editing=id;const t=tasks.find(t=>t.id===id);$('form').reset();$('modal-title').textContent=t?'할 일 수정':'새 할 일';$('title').value=t?.title||'';$('desc').value=t?.desc||'';$('status').value=t?.status||status;$('priority').value=t?.priority||'normal';$('due').value=t?.due||'';$('delete').hidden=!t;$('modal').showModal();$('title').focus();}
$('new').onclick=()=>openEditor();$('cancel').onclick=()=>$('modal').close();$('search').oninput=render;$('filter').onchange=render;
$('form').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title){$('title').setCustomValidity('제목을 입력해 주세요.');$('title').reportValidity();return;}const t={id:editing||crypto.randomUUID(),title,desc:$('desc').value.trim(),status:$('status').value,priority:$('priority').value,due:$('due').value};if(editing)tasks=tasks.map(x=>x.id===editing?t:x);else tasks.push(t);save();$('modal').close();};$('title').oninput=()=>$('title').setCustomValidity('');
$('delete').onclick=()=>{if(confirm('이 할 일을 삭제할까요?')){tasks=tasks.filter(t=>t.id!==editing);save();$('modal').close();}};
$('board').onclick=e=>{const edit=e.target.closest('[data-edit]'),add=e.target.closest('[data-add]');if(edit)openEditor(edit.dataset.edit);if(add)openEditor(null,add.dataset.add);};
$('board').ondragstart=e=>{const card=e.target.closest('.card');if(!card)return;dragging=card.dataset.id;e.dataTransfer.setData('text/plain',dragging);e.dataTransfer.effectAllowed='move';};$('board').ondragover=e=>{const col=e.target.closest('.column');if(col&&dragging){e.preventDefault();document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));col.classList.add('over');}};$('board').ondrop=e=>{e.preventDefault();const col=e.target.closest('.column');if(col&&dragging){const t=tasks.find(t=>t.id===dragging);if(t)t.status=col.dataset.status;save();}dragging=null;};$('board').ondragend=()=>{dragging=null;document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));};render();
</script></body></html>
